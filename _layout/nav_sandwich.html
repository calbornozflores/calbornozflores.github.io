<div class="nav-sandwich">
  <button class="nav-sandwich__btn" id="navSandwichBtn" aria-label="Toggle navigation" aria-expanded="false">
    <span></span><span></span><span></span>
  </button>
  <div class="nav-sandwich__menu" id="navSandwichMenu">
    <a href="/">Projects</a>
    <a href="/experience/">Experience</a>
  </div>
</div>
<script>
  (function () {
    var btn = document.getElementById("navSandwichBtn");
    var menu = document.getElementById("navSandwichMenu");
    if (!btn || !menu) return;
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      var open = menu.classList.toggle("is-open");
      btn.setAttribute("aria-expanded", open ? "true" : "false");
    });
    document.addEventListener("click", function (e) {
      if (!menu.contains(e.target) && e.target !== btn) {
        menu.classList.remove("is-open");
        btn.setAttribute("aria-expanded", "false");
      }
    });
  })();
</script>
